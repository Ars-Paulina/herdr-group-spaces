id = "group-spaces"
name = "Group Spaces"
version = "0.2.2"
min_herdr_version = "0.9.5"
description = "Group Spaces by git project, sort by status inside each group, and label each group with a header"
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "-I", "group_spaces.py"]

# Re-sort whenever a space or pane appears/disappears or an agent changes status.
# Not workspace.moved / reordered / metadata_updated: this plugin's own writes emit those.
[[events]]
on = "workspace.created"
command = ["python3", "-I", "group_spaces.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "-I", "group_spaces.py"]

[[events]]
on = "workspace.renamed"
command = ["python3", "-I", "group_spaces.py"]

[[events]]
on = "pane.created"
command = ["python3", "-I", "group_spaces.py"]

[[events]]
on = "pane.closed"
command = ["python3", "-I", "group_spaces.py"]

# A cd is not a plugin event (herdr 0.9.5 sends pane.updated to API subscribers only),
# so re-check whenever focus moves: a pane that cd'd into another repo regroups as soon as you switch away.
[[events]]
on = "pane.focused"
command = ["python3", "-I", "group_spaces.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-I", "group_spaces.py"]

# Run by hand (e.g. after cd-ing a pane into another repo).
[[actions]]
id = "apply"
title = "Re-group Spaces now"
contexts = ["workspace"]
command = ["python3", "-I", "group_spaces.py"]

# Switch between the project view (groups + headers) and a plain status-sorted view.
[[actions]]
id = "toggle"
title = "Toggle project groups"
contexts = ["workspace"]
command = ["python3", "-I", "group_spaces.py", "--toggle"]

# Opens the rename popup below.
[[actions]]
id = "rename"
title = "Rename a project group"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin group-spaces --entrypoint rename"]

[[panes]]
id = "rename"
title = "Rename a project group"
placement = "popup"
width = "60%"
height = "60%"
command = ["python3", "-I", "group_spaces.py", "--rename"]
